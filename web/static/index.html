<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIT_COMMONALITY</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/Poppins-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<!-- 시작 화면: Job ID로 실행 기록 찾기 · raw.csv 올리기 · 최근 실행 · 사용자 가이드 -->
<main id="home" class="home" hidden>
  <div class="home-corner">
  <button class="icon-btn theme-btn" type="button" data-theme-toggle title="어두운 화면으로" aria-label="어두운 화면으로">
    <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
  </button>
  </div>
  <header class="home-header">
    <h1 class="home-title"><span class="uc-logo" aria-label="UNIT_COMMONALITY"><span class="w1">UNIT</span><span class="us">_</span><span class="w2">COMMONALITY</span></span></h1>
  </header>
  <section class="query-area" aria-label="Job ID 조회">
    <div class="query-panel">
      <form class="query-form" id="home-form" autocomplete="off">
        <button class="query-occas-trigger" id="home-upload" type="button" aria-label="raw.csv 올려서 분석">
          <svg class="query-occas-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          <span class="query-occas-label">csv</span><span class="query-icon-tooltip" role="tooltip">raw.csv 올려서 분석</span>
        </button>
        <input type="file" id="home-file" accept=".csv" hidden>
        <label>
          <span class="visually-hidden">Job ID</span>
          <input id="home-q" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Job ID를 입력하세요"
                 role="combobox" aria-expanded="false" aria-controls="home-list" aria-autocomplete="list">
        </label>
        <button class="query-recent-button" id="home-recent" type="button" title="최근 실행 기록" aria-label="최근 실행 기록">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V9H8"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <a class="query-guide" href="guide.html" title="사용자 가이드" aria-label="사용자 가이드">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5c-1.8-1.3-4.3-2-7.5-2v13c3.2 0 5.7.7 7.5 2 1.8-1.3 4.3-2 7.5-2v-13c-3.2 0-5.7.7-7.5 2Z"/><path d="M12 6.5v13"/></svg>
        </a>
      </form>
      <div class="home-pop" id="home-list" role="listbox" aria-label="실행 기록" hidden></div>
    </div>
    <div class="home-msg" id="home-msg" aria-live="polite"></div>
    <p class="home-hint">Job ID로 지난 실행을 찾거나, 왼쪽 <b>CSV</b> 버튼으로 raw.csv를 올려 새로 분석합니다.</p>
  </section>
</main>

<!-- 분석 화면 -->
<div id="app" hidden>
<header class="topbar">
  <a class="uc-logo brand" href="#" title="처음 화면으로" aria-label="UNIT_COMMONALITY 처음 화면으로"><span class="w1">UNIT</span><span class="us">_</span><span class="w2">COMMONALITY</span></a>
  <span class="muted" id="topnote">Job ID를 넣거나 raw.csv를 올리고 Run을 누르세요</span>
  <span class="grow"></span>
  <button class="icon-btn" id="top-history" type="button" title="실행 기록" aria-label="실행 기록으로">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V9H8"/><path d="M12 7.5V12l3 2"/></svg>
  </button>
  <a class="icon-btn" href="guide.html" title="사용자 가이드" aria-label="사용자 가이드">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5c-1.8-1.3-4.3-2-7.5-2v13c3.2 0 5.7.7 7.5 2 1.8-1.3 4.3-2 7.5-2v-13c-3.2 0-5.7.7-7.5 2Z"/><path d="M12 6.5v13"/></svg>
  </a>
  <button class="icon-btn theme-btn" type="button" data-theme-toggle title="어두운 화면으로" aria-label="어두운 화면으로">
    <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
  </button>
</header>

<main class="page">
  <section class="card setup" aria-label="실행 설정">
    <!-- 데이터: Job ID를 넣거나(DB에서 가져옴) 왼쪽 csv로 raw.csv를 붙인다. 붙인 파일이 있으면 그 파일로 실행 -->
    <div class="qbar" id="qbar">
      <button class="q-chip" id="csv-btn" type="button" title="raw.csv 올려서 분석" aria-label="raw.csv 올려서 분석">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>csv</span>
      </button>
      <input type="file" id="file" accept=".csv" hidden>
      <span class="q-file" id="q-file" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>
        <span class="q-file-name" id="q-file-name"></span>
        <button type="button" class="q-x" id="q-file-x" title="파일 빼고 Job ID로" aria-label="붙인 파일 빼기">✕</button>
      </span>
      <input id="job_id" class="q-text" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Job ID를 입력하세요 (예: 2281935)" aria-label="Job ID">
    </div>
    <div class="row opt-row">
      <span class="field"><label for="min_n">MIN_N</label><input id="min_n" type="number" min="2" step="1" value="4"></span>
      <span class="field"><label for="max_depth">MAX_DEPTH</label><input id="max_depth" type="number" min="1" step="1" value="5">
        <label class="chk"><input type="checkbox" id="no_limit">제한 없음</label></span>
      <button id="adv-btn" class="ghost" type="button" aria-expanded="false">고급 설정 <span id="adv-ico">▾</span></button>
      <span class="grow"></span>
      <button id="run" class="primary" type="button">Run</button>
    </div>
    <div id="adv" class="adv" hidden>
      <span class="field"><label for="higher_is_worse">Value 방향</label><select id="higher_is_worse"><option value="true">클수록 나쁨</option><option value="false">클수록 좋음</option></select></span>
      <span class="field"><label for="y_transform">Value 치우침</label><select id="y_transform"><option value="auto">자동 (치우치면 순위로)</option><option value="rank">순위로</option><option value="log">로그로</option><option value="">그대로</option></select></span>
      <span class="field"><label for="part_adjust">part별 맞춤</label><select id="part_adjust"><option value="true">켬</option><option value="auto">차이가 뚜렷할 때만</option><option value="false">끔</option></select></span>
      <span class="field"><label for="part_min">작은 part 묶기 (장 미만)</label><input id="part_min" type="number" min="1" step="1" value="20"></span>
      <span class="field"><label for="rework">재작업 이력</label><select id="rework"><option value="last">마지막 줄</option><option value="first">처음 줄</option></select></span>
      <span class="field"><label for="spread_adjust">퍼짐 보정</label><select id="spread_adjust"><option value="true">켬</option><option value="false">끔</option></select></span>
      <span class="field"><label for="same_wafers">같은 웨이퍼 묶기 (%)</label><input id="same_wafers" type="number" min="1" max="100" step="1" value="90"></span>
      <span class="field"><label for="part_id">part_id</label><input id="part_id" type="text" placeholder="전체"></span>
      <span class="field"><label for="line_id">line_id</label><input id="line_id" type="text" placeholder="전체"></span>
      <span class="field"><label for="step_suffix">STEP 이름 규칙</label><input id="step_suffix" type="text" value="_(\d+)$"></span>
    </div>
    <div id="src-note" class="src-note muted small" hidden></div>
    <!-- 계산 중: 픽셀 칩 캐릭터가 걷는 로딩 장면 · 단계 글자 · 진행 막대 -->
    <div id="loader" class="loader" hidden aria-live="polite">
      <div class="scene" id="scene" aria-hidden="true"></div>
      <div class="loader-line"><span class="shimmer" id="loader-text">준비 중</span><span class="muted" id="loader-time"></span></div>
      <div class="bar"><i id="loader-bar"></i></div>
    </div>
    <div id="status" class="status" hidden></div>
  </section>

  <section class="card" id="history-card" aria-label="실행 기록">
    <div class="card-head">
      <h2>History</h2><span class="muted small" id="hist-sub"></span><span class="grow"></span>
      <input id="hist-q" type="search" placeholder="job_id · 파일 이름 찾기" aria-label="실행 기록 찾기">
    </div>
    <div class="table-wrap hist-wrap" id="history" aria-label="실행 기록 목록"><div class="empty muted">불러오는 중…</div></div>
  </section>

  <section id="results" hidden>
    <div class="card summary" id="summary"></div>
    <div class="grid-main">
      <div class="card">
        <div class="card-head">
          <h2>Funnel</h2><span class="muted small" id="fhint">모든 STEP의 조합 · 드래그로 여러 순위 고르기 (Ctrl · ⌘ · Shift: 더하기)</span><span class="grow"></span>
          <span class="seg" id="yseg" role="group" aria-label="funnel 세로축">
            <button type="button" data-v="judg" class="on">종합</button><button type="button" data-v="mean">y_value 평균</button><button type="button" data-v="bad">bad 비율</button>
          </span>
        </div>
        <div class="chart" id="funnel"><canvas></canvas><svg role="img" aria-label="funnel 차트"></svg></div>
        <div class="legend" id="funnel-legend"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Ranking</h2><span class="muted small" id="rank-sub"></span></div>
        <div class="table-wrap" id="ranking" tabindex="0" aria-label="혐의 대상 순위표"></div>
      </div>
    </div>
  </section>

  <section id="details" hidden aria-live="polite">
    <div class="details-note muted small" id="details-note" hidden></div>
  </section>
</main>
</div>

<!-- 상세 카드 하나 (고른 대상마다 복제) -->
<template id="panel-tpl">
  <article class="card panel">
    <div class="detail-head">
      <button type="button" class="ghost" data-a="prev" aria-label="이전 순위">◀</button>
      <div class="dh" data-r="dh"></div>
      <button type="button" class="ghost" data-a="next" aria-label="다음 순위">▶</button>
      <button type="button" class="ghost close" data-a="close" aria-label="이 상세 닫기" title="닫기">✕</button>
    </div>
    <div class="dstat" data-r="dstat">불러오는 중…</div>
    <div class="row sel-row">
      <span class="chips" data-r="chips"></span>
      <button type="button" class="ghost" data-a="reset">↺ 원래 경로로</button>
    </div>
    <div class="related" data-r="related" hidden></div>
    <div class="grid-2x2">
      <div class="sub cell">
        <div class="sub-head"><h3>Order × Unit</h3><span class="grow"></span><span class="muted small">칸 = 그 Order에서 그 Unit을 지난 웨이퍼 · 클릭해서 고르거나 빼기</span></div>
        <div class="blocks" data-r="blocks"></div>
      </div>
      <div class="sub cell">
        <div class="sub-head"><h3>웨이퍼 산점도</h3><span class="grow"></span>
          <label class="size-ctl muted small">점 크기 <input type="range" min="1" max="8" step="0.5" data-a="size" aria-label="산점도 점 크기"></label>
          <span class="seg small" data-r="cseg" role="group" aria-label="산점도 색"><button type="button" data-v="hi" class="on">선택 경로 강조</button><button type="button" data-v="combo">조합별 색</button></span>
        </div>
        <div class="legend" data-r="slegend"></div>
        <svg class="chart-svg" data-r="scatter" role="img" aria-label="웨이퍼 산점도"></svg>
      </div>
      <div class="sub cell">
        <div class="sub-head"><h3>같은 Order 다른 경로 비교</h3><span class="grow"></span>
          <span class="seg small" data-r="pseg" role="group" aria-label="비교 차트 세로축"><button type="button" data-v="judg" class="on">종합</button><button type="button" data-v="mean">y_value 평균</button><button type="button" data-v="bad">bad 비율</button></span>
        </div>
        <svg class="chart-svg" data-r="peers" role="img" aria-label="같은 Order 다른 경로 비교"></svg>
      </div>
      <div class="sub cell">
        <div class="sub-head"><h3>이 경로 vs 나머지</h3></div>
        <svg class="chart-svg" data-r="compare" role="img" aria-label="이 경로와 나머지 비교"></svg>
      </div>
    </div>
  </article>
</template>

<div id="tip" class="tip" hidden></div>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
